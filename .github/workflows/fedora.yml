name: Fedora CI and alpha release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      previous_commit:
        description: SHA of main immediately before the version-bump push
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test and package on Fedora 45
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45
      # Reap orphaned children from the process-group cancellation tests.
      options: --init
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Install Fedora build dependencies
        run: |
          dnf -y install git gcc cargo rust rpm-build redhat-rpm-config \
            pkgconf-pkg-config gtk4-devel libadwaita-devel vte291-gtk4-devel \
            desktop-file-utils libappstream-glib python3 procps-ng findutils gzip tar \
            xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run tests with a GTK display
        env:
          GDK_BACKEND: x11
          GITTRELLIS_REQUIRE_GTK_TESTS: "1"
        run: xvfb-run -a dbus-run-session -- cargo test --locked

      - name: Check for a release version
        if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && github.ref_type == 'tag')
        id: version
        env:
          BEFORE: ${{ github.event.before || inputs.previous_commit }}
        run: |
          # The runner owns this mounted checkout and the Fedora container runs as root.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 scripts/release-info.py --tag "$GITHUB_REF_NAME"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$BEFORE" HEAD; then
              echo "Supply the full previous commit SHA from main's history." >&2
              exit 1
            fi
          fi
          python3 scripts/release-info.py --before "$BEFORE"

      - name: Build and verify release assets
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/build-rpm.sh
          shopt -s nullglob
          rpms=(dist/rpmbuild/RPMS/x86_64/gittrellis-"$VERSION"-*.fc45.x86_64.rpm)
          if [[ ${#rpms[@]} -ne 1 ]]; then
            echo "Expected exactly one Fedora 45 x86_64 RPM for GitTrellis $VERSION" >&2
            exit 1
          fi
          cp "${rpms[0]}" "dist/gittrellis-$VERSION.tar.gz" dist/release/
          cd dist/release
          sha256sum -- *.rpm *.tar.gz > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.version != ''
        with:
          name: gittrellis-${{ steps.version.outputs.version }}
          path: dist/release/
          if-no-files-found: error

  publish:
    name: Publish GitHub alpha
    needs: test
    if: needs.test.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gittrellis-release-${{ needs.test.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gittrellis-${{ needs.test.outputs.version }}

      - name: Upload assets and publish
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
          RELEASE_COMMIT: ${{ needs.test.outputs.commit }}
        run: |
          tag="v$VERSION"
          release="$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.tag_name == \"$tag\")")"

          if [[ -n "$release" ]] && jq -e '.draft == false' <<< "$release" > /dev/null; then
            echo "$tag is already published."
            exit 0
          fi

          sha256sum --check SHA256SUMS
          remote_tags="$(git ls-remote --tags "$GITHUB_SERVER_URL/$GH_REPO.git" \
            "refs/tags/$tag" "refs/tags/$tag^{}")"
          tagged_commit="$(awk -v peeled_ref="refs/tags/$tag^{}" '
            $2 == peeled_ref { peeled = $1 }
            NF == 2 { ref = $1 }
            END { print (peeled ? peeled : ref) }
          ' <<< "$remote_tags")"
          if [[ "$GITHUB_REF_TYPE" == tag && -z "$tagged_commit" ]]; then
            echo "$tag is no longer on GitHub" >&2
            exit 1
          fi
          if [[ -n "$tagged_commit" && "$tagged_commit" != "$RELEASE_COMMIT" ]]; then
            echo "$tag already points to a different commit" >&2
            exit 1
          fi

          if [[ -z "$release" ]]; then
            tag_options=()
            if [[ -n "$tagged_commit" ]]; then
              tag_options+=(--verify-tag)
            fi
            gh release create "$tag" --draft --prerelease --target "$RELEASE_COMMIT" \
              "${tag_options[@]}" --title "GitTrellis $VERSION alpha" --notes-file notes.md
          elif ! jq -e --arg sha "$RELEASE_COMMIT" --arg tagged "$tagged_commit" \
            '.draft and .prerelease and ($tagged == $sha or .target_commitish == $sha)' \
            <<< "$release" > /dev/null; then
            echo "$tag has a draft belonging to a different release target" >&2
            exit 1
          fi

          gh release upload "$tag" --clobber -- *.rpm *.tar.gz SHA256SUMS
          gh release edit "$tag" --draft=false
