[package]
name = "stratum"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A native Git GUI client for Linux"
license = "GPL-3.0-or-later"
authors = ["Stratum contributors"]
repository = "https://example.invalid/stratum"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
glib = "0.22"
gio = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-channel = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
